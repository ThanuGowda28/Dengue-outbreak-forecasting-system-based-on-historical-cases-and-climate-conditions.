services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [dengue-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-dengue_forecasting}
      MYSQL_USER: ${DB_USER:-dengue_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [dengue-internal]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DATABASE_URL: ""
      PORT: 5000
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_ENV: production
      ML_MODEL_DIR: /app/backend/app/ml/models
      ML_PROCESSED_DIR: /app/backend/app/ml/dataset/processed
      LOG_DIR: /app/backend/logs
      UPLOAD_FOLDER: /app/backend/instance/uploads
      MOSQUITO_UPLOAD_DIR: /app/backend/instance/mosquito_detections
    volumes:
      - upload_data:/app/backend/instance/uploads
      - detection_data:/app/backend/instance/mosquito_detections
      - log_data:/app/backend/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks: [dengue-internal, dengue-egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  db-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    env_file: .env
    environment:
      APP_ENV: production
      FLASK_DEBUG: "0"
      DB_HOST: mysql
      DB_PORT: 3306
      DATABASE_URL: ""
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN to the deployed HTTPS origin}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ML_MODEL_DIR: /app/backend/app/ml/models
      ML_PROCESSED_DIR: /app/backend/app/ml/dataset/processed
      LOG_DIR: /app/backend/logs
      UPLOAD_FOLDER: /app/backend/instance/uploads
    command: ["flask", "--app", "backend.run", "db", "upgrade"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [dengue-internal]

  alert-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DATABASE_URL: ""
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_ENV: production
      ML_MODEL_DIR: /app/backend/app/ml/models
      ML_PROCESSED_DIR: /app/backend/app/ml/dataset/processed
      LOG_DIR: /app/backend/logs
      UPLOAD_FOLDER: /app/backend/instance/uploads
    command: ["celery", "-A", "backend.celery_worker:celery", "worker", "--loglevel=info"]
    volumes:
      - upload_data:/app/backend/instance/uploads
      - log_data:/app/backend/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [dengue-internal, dengue-egress]

  alert-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DATABASE_URL: ""
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_ENV: production
      ML_MODEL_DIR: /app/backend/app/ml/models
      ML_PROCESSED_DIR: /app/backend/app/ml/dataset/processed
      LOG_DIR: /app/backend/logs
      UPLOAD_FOLDER: /app/backend/instance/uploads
    command: ["celery", "-A", "backend.celery_worker:celery", "beat", "--loglevel=info"]
    volumes:
      - upload_data:/app/backend/instance/uploads
      - log_data:/app/backend/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [dengue-internal, dengue-egress]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [dengue-internal, dengue-edge]

volumes:
  mysql_data:
  redis_data:
  upload_data:
  detection_data:
  log_data:

networks:
  dengue-internal:
    internal: true
  dengue-egress:
    driver: bridge
  dengue-edge:
