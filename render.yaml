services:
  - type: web
    name: dengue-forecasting-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health/model
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"
      - key: MAIL_TIMEOUT_SECONDS
        value: "15"
      - key: NASA_POWER_URL
        value: https://power.larc.nasa.gov/api/temporal/daily/point
      - key: WEATHER_CACHE_TTL_SECONDS
        value: "300"
      - key: WEATHER_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: ML_MODEL_DIR
        value: /app/backend/app/ml/models
      - key: ML_PROCESSED_DIR
        value: /app/backend/app/ml/dataset/processed
      - key: UPLOAD_FOLDER
        value: /app/backend/instance/uploads
      - key: LOG_DIR
        value: /app/backend/logs
