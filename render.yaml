services:
  - type: web
    name: dengue-forecasting-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    preDeployCommand: flask --app backend.run db upgrade
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"
      - key: MAIL_TIMEOUT_SECONDS
        value: "15"
      - key: REDIS_URL
        sync: false
      - key: AUTO_MIGRATE_DATABASE
        value: "false"
      - key: ALERT_RETRY_DELAY_SECONDS
        value: "10"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: NASA_POWER_URL
        value: https://power.larc.nasa.gov/api/temporal/daily/point
      - key: WEATHER_CACHE_TTL_SECONDS
        value: "300"
      - key: WEATHER_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: ML_MODEL_DIR
        value: /app/backend/app/ml/models
      - key: ML_PROCESSED_DIR
        value: /app/backend/app/ml/dataset/processed
      - key: UPLOAD_FOLDER
        value: /app/backend/instance/uploads
      - key: LOG_DIR
        value: /app/backend/logs
