openapi: 3.0.3
info:
  title: Dengue Forecasting API
  version: 1.0.0
  description: >
    Flask REST API for verified accounts, user records, live weather,
    dashboards, reports, administration, and saved-model inference. The model
    provides preliminary case-count classifications, not a validated
    operational outbreak forecast.
servers:
  - url: http://localhost:5000/api
    description: Local development
  - url: https://your-api.example.com/api
    description: Replace with the configured deployment API URL before production
tags:
  - name: Health
  - name: Authentication
  - name: Weather
  - name: Risk Map
  - name: Dashboard
  - name: Prediction
  - name: Reports
  - name: Records
  - name: Administration
  - name: Contact
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        "200": { description: API process is live }
  /health/database:
    get:
      tags: [Health]
      summary: Database readiness probe
      responses:
        "200": { description: Database is available }
        "503": { description: Database is unavailable }
  /health/model:
    get:
      tags: [Health]
      summary: Model availability probe
      responses:
        "200": { description: Model bundle is loaded }
        "503": { description: Model bundle is unavailable }
  /health/weather:
    get:
      tags: [Health]
      summary: Weather provider configuration probe
      responses:
        "200": { description: OpenWeather is configured }
        "503": { description: OpenWeather API key is missing }
  /health/system:
    get:
      tags: [Health]
      summary: System and database status
      responses:
        "200": { description: System metrics are available }
        "503": { description: System probe failed }
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register account
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: Account created; verification email sent; no session tokens issued }
        "400": { description: Validation error }
        "409": { description: Email already registered }
        "503": { description: "Email delivery is unavailable; after a delivery failure the response includes account_created: true" }
  /auth/email-verification:
    post:
      tags: [Authentication]
      summary: Verify an email address using its single-use link, valid for 24 hours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: Email verified; token consumed }
        "400": { description: Invalid, expired, or already used verification token }
        "429": { description: Verification request rate limit exceeded }
  /auth/email-verification/resend:
    post:
      tags: [Authentication]
      summary: Resend an email verification link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Generic response that does not disclose account existence }
        "400": { description: Invalid email address }
        "429": { description: Verification request rate limit exceeded }
        "503": { description: Verification email delivery is unavailable }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate using email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Access and refresh tokens returned }
        "401": { description: Invalid credentials }
        "403": { description: Email verification is required }
  /admin/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a verified administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200": { description: Administrator access and refresh tokens returned }
        "400": { description: Invalid request body }
        "401": { description: Invalid credentials or account is not an administrator }
        "403": { description: Email verification is required }
  /auth/profile:
    get:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current account profile, including the is_verified email-verification status }
        "401": { description: Authentication required }
    put:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Updated account profile, including the is_verified email-verification status }
        "400": { description: Validation error }
  /auth/logout:
    post:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Token revoked }
  /auth/refresh:
    post:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Access token refreshed }
  /auth/change-password:
    post:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Password changed }
        "400": { description: Validation error }
        "401": { description: Authentication required or current password is invalid }
  /auth/password-reset-request:
    post:
      tags: [Authentication]
      summary: Request password reset instructions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Generic response that does not disclose account existence }
        "400": { description: Invalid email address }
        "429": { description: Public request rate limit exceeded }
        "503": { description: Email delivery is not configured or failed }
  /auth/password-reset:
    post:
      tags: [Authentication]
      summary: Set a new password using a one-hour recovery token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, confirm_password]
              properties:
                token: { type: string }
                password: { type: string, format: password }
                confirm_password: { type: string, format: password }
      responses:
        "200": { description: Password changed; recovery token cannot be reused }
        "400": { description: Invalid, expired, or already-used token, or invalid password }
  /auth/settings:
    get:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current user's saved preferences }
        "401": { description: Authentication required }
    put:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alerts, weekly_summary, dark_mode]
              properties:
                alerts: { type: boolean }
                weekly_summary: { type: boolean }
                dark_mode: { type: boolean }
      responses:
        "200": { description: Preferences saved }
        "400": { description: Invalid preferences }
        "401": { description: Authentication required }
  /contact:
    post:
      tags: [Contact]
      summary: Send a website contact message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                message: { type: string, maxLength: 5000 }
      responses:
        "202": { description: Contact email sent }
        "400": { description: Invalid message fields }
        "429": { description: Public request rate limit exceeded }
        "503": { description: Contact delivery is not configured or failed }
  /profile/emergency-contact:
    get:
      tags: [Records]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current user's emergency contact, or null }
        "401": { description: Authentication required }
    put:
      tags: [Records]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name: { type: string }
                phone: { type: string }
      responses:
        "200": { description: Emergency contact saved }
        "400": { description: Invalid contact fields }
        "401": { description: Authentication required }
    delete:
      tags: [Records]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Emergency contact deleted }
        "401": { description: Authentication required }
        "404": { description: Emergency contact not found }
  /prescriptions:
    get:
      tags: [Records]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current user's prescription transcriptions }
        "401": { description: Authentication required }
    post:
      tags: [Records]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: Prescription transcription created }
        "400": { description: Invalid prescription fields }
        "401": { description: Authentication required }
  /prescriptions/{record_id}:
    parameters:
      - in: path
        name: record_id
        required: true
        schema: { type: integer }
    put:
      tags: [Records]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Prescription transcription updated }
        "400": { description: Invalid prescription fields }
        "401": { description: Authentication required }
        "404": { description: User-owned prescription not found }
    delete:
      tags: [Records]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Prescription transcription deleted }
        "401": { description: Authentication required }
        "404": { description: User-owned prescription not found }
  /weather/districts:
    get:
      tags: [Weather]
      responses:
        "200": { description: Supported Karnataka district coordinates }
  /weather/search:
    get:
      tags: [Weather]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        "200": { description: Matching locations }
        "400": { description: Invalid search query or coordinates }
        "401": { description: Authentication required }
        "429": { description: Per-user weather request limit exceeded }
        "502": { description: Location provider returned invalid data or failed }
        "503": { description: Provider credentials missing or provider unavailable }
  /weather/current:
    get:
      tags: [Weather]
      summary: Get authenticated current weather from OpenWeather
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: district
          schema: { type: string }
        - in: query
          name: latitude
          schema: { type: number }
        - in: query
          name: longitude
          schema: { type: number }
      responses:
        "200": { description: Current conditions, source, location, and whether the provider response was cached }
        "401": { description: Authentication required }
        "400": { description: Invalid location }
        "429": { description: Per-user weather request limit exceeded }
        "502": { description: Provider returned an invalid response or request failed }
        "503": { description: Provider credentials missing or rejected, or provider unavailable }
  /weather/forecast:
    get:
      tags: [Weather]
      summary: Get one to five days of authenticated OpenWeather forecast
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: district
          schema: { type: string }
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 5, default: 5 }
      responses:
        "200": { description: Forecast intervals, source, location, and cache status }
        "400": { description: Invalid location or day count }
        "401": { description: Authentication required }
        "429": { description: Per-user weather request limit exceeded }
        "502": { description: Provider returned an invalid response or request failed }
        "503": { description: Provider credentials missing or rejected, or provider unavailable }
  /weather/history:
    get:
      tags: [Weather]
      summary: Get authenticated historical daily climate data from NASA POWER
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: latitude
          schema: { type: number }
        - in: query
          name: longitude
          schema: { type: number }
        - in: query
          name: start_date
          schema: { type: string, format: date }
        - in: query
          name: end_date
          schema: { type: string, format: date }
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
      responses:
        "200": { description: Historical observations, source, location, and cache status }
        "400": { description: Invalid coordinates or date range }
        "401": { description: Authentication required }
        "429": { description: Per-user weather request limit exceeded }
        "502": { description: Provider returned an invalid response or request failed }
        "503": { description: Historical provider unavailable, misconfigured, or has no published observations for the selected range }
  /risk-map:
    get:
      tags: [Risk Map]
      summary: Get modelled dengue risk for Karnataka districts
      description: Uses rolling 365-day NASA POWER climate aggregates with the existing ensemble model. Prediction is the model's uncalibrated top-class confidence, not a calibrated probability.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Risk levels and climate observations for all Karnataka districts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [district, latitude, longitude, risk, temperature, humidity, rainfall, prediction, recommendations]
                  properties:
                    district: { type: string }
                    state: { type: string, example: Karnataka }
                    latitude: { type: number, format: float }
                    longitude: { type: number, format: float }
                    risk: { type: string, enum: [Low, Medium, High, Very High] }
                    temperature: { type: number, description: Rolling-year mean temperature in Celsius }
                    humidity: { type: number, description: Rolling-year mean relative humidity percentage }
                    rainfall: { type: number, description: Rolling-year rainfall total in millimeters }
                    prediction: { type: number, description: Uncalibrated model top-class confidence percentage }
                    recommendations:
                      type: array
                      items: { type: string }
        "401": { description: Authentication required }
        "429": { description: Per-user weather request limit exceeded }
        "500": { description: Ensemble inference failed }
        "502": { description: Historical weather provider returned an invalid response }
        "503": { description: Prediction model or historical climate data unavailable }
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Get the authenticated user's dashboard and generated informational alerts
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current account data; alerts include today's Moderate/High saved model assessments when account notifications are enabled }
        "401": { description: Authentication required }
  /prediction/predict:
    post:
      tags: [Prediction]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Risk prediction and class probabilities }
        "400": { description: Invalid prediction input }
        "503": { description: Model artifacts are unavailable }
  /prediction/history:
    get:
      tags: [Prediction]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Paginated prediction history }
  /prediction/history/{prediction_id}:
    parameters:
      - in: path
        name: prediction_id
        required: true
        schema: { type: integer }
    delete:
      tags: [Prediction]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Prediction history deleted }
        "401": { description: Authentication required }
        "404": { description: Prediction record not found or outside user scope }
  /prediction/latest:
    get:
      tags: [Prediction]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Latest prediction, or null when no prediction is saved }
  /prediction/model-info:
    get:
      tags: [Prediction]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Model metadata and availability }
  /alerts/send:
    post:
      tags: [Alerts]
      summary: Queue eligible alerts for an owned prediction
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prediction_id]
              properties:
                prediction_id: { type: integer, minimum: 1 }
      responses:
        "202": { description: Eligible email and SMS alerts queued }
        "400": { description: Invalid request or prediction identifier }
        "404": { description: Prediction not found or outside user scope }
  /alerts/settings:
    get:
      tags: [Alerts]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current user's alert preferences }
    put:
      tags: [Alerts]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email_alerts, sms_alerts, daily_notifications, high_risk_notifications, weather_alerts]
              properties:
                email_alerts: { type: boolean }
                sms_alerts: { type: boolean, description: Disabled by default; users must opt in }
                daily_notifications: { type: boolean }
                high_risk_notifications: { type: boolean }
                weather_alerts: { type: boolean }
      responses:
        "200": { description: Preferences saved }
        "400": { description: Invalid or incomplete preferences }
  /alerts/history:
    get:
      tags: [Alerts]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: type
          schema: { type: string, enum: [email, sms] }
        - in: query
          name: status
          schema: { type: string, enum: [queued, sending, retrying, sent, failed] }
        - in: query
          name: start_date
          schema: { type: string, format: date }
        - in: query
          name: end_date
          schema: { type: string, format: date }
      responses:
        "200": { description: Paginated alert history scoped to the authenticated user }
        "400": { description: Invalid pagination, filter, or date range }
  /alerts/admin/history:
    get:
      tags: [Alerts]
      summary: Search and filter all alert records
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Paginated system-wide alert history including user details }
        "403": { description: Administrator access required }
  /alerts/admin/export:
    get:
      tags: [Alerts]
      summary: Export filtered alert history as CSV
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: CSV attachment }
        "403": { description: Administrator access required }
  /mosquito-detection/analyze:
    post:
      tags: [Mosquito detection]
      summary: Analyze and save an uploaded potential breeding-site image
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                district: { type: string, maxLength: 100 }
      responses:
        "201": { description: Analysis result (prediction, confidence, objects_detected, recommendation, and alerts) }
        "400": { description: Invalid image, location, or unsupported file format }
        "413": { description: Image exceeds 10 MB }
        "503": { description: Trained mosquito detector is unavailable or incompatible }
  /mosquito-detection/history:
    get:
      tags: [Mosquito detection]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: risk, schema: { type: string, enum: [High Risk Breeding Site, Medium Risk Breeding Site, Low Risk, No Breeding Site Detected] } }
        - { in: query, name: start_date, schema: { type: string, format: date } }
        - { in: query, name: end_date, schema: { type: string, format: date } }
      responses:
        "200": { description: Owner-scoped paginated analysis history }
  /mosquito-detection/{detection_id}:
    parameters:
      - { in: path, name: detection_id, required: true, schema: { type: integer } }
    delete:
      tags: [Mosquito detection]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Analysis record and stored images deleted }
        "404": { description: Record not found or outside user scope }
  /mosquito-detection/{detection_id}/image:
    parameters:
      - { in: path, name: detection_id, required: true, schema: { type: integer } }
    get:
      tags: [Mosquito detection]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: kind, schema: { type: string, enum: [original, annotated] } }
      responses:
        "200": { description: Private original or annotated image, owner/admin only }
        "404": { description: Image not found or access denied }
  /mosquito-detection/{detection_id}/report.pdf:
    parameters:
      - { in: path, name: detection_id, required: true, schema: { type: integer } }
    get:
      tags: [Mosquito detection]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Downloadable PDF containing the uploaded image and analysis }
  /mosquito-detection/{detection_id}/alerts:
    parameters:
      - { in: path, name: detection_id, required: true, schema: { type: integer } }
    post:
      tags: [Mosquito detection]
      security: [{ bearerAuth: [] }]
      responses:
        "202": { description: Eligible failed high-risk alerts queued for retry }
  /mosquito-detection/admin/reports:
    get:
      tags: [Mosquito detection]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: risk, schema: { type: string } }
        - { in: query, name: start_date, schema: { type: string, format: date } }
        - { in: query, name: end_date, schema: { type: string, format: date } }
      responses:
        "200": { description: Admin-only paginated detection reports, including user details }
        "403": { description: Administrator access required }
  /mosquito-detection/admin/export:
    get:
      tags: [Mosquito detection]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Admin-only CSV export of filtered reports }
        "403": { description: Administrator access required }
  /mosquito-detection/high-risk-locations:
    get:
      tags: [Mosquito detection]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Admin-only coordinates for high-risk reports shown on the risk map }
        "403": { description: Administrator access required }
  /reports/weather:
    get:
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [current, forecast, history] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: district
          schema: { type: string }
        - in: query
          name: start_date
          schema: { type: string, format: date }
        - in: query
          name: end_date
          schema: { type: string, format: date }
      responses:
        "200": { description: Paginated stored observations scoped to the authenticated account and filtered by type, district, and inclusive observation dates }
        "400": { description: Invalid type, page, limit, or date range }
        "401": { description: Authentication required }
        "429": { description: Request limit exceeded }
  /reports/statistics:
    get:
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: district
          schema: { type: string }
        - in: query
          name: start_date
          schema: { type: string, format: date }
        - in: query
          name: end_date
          schema: { type: string, format: date }
      responses:
        "200": { description: Weather statistics and climate trends scoped to the authenticated account and selected inclusive date range }
        "400": { description: Invalid date range }
        "401": { description: Authentication required }
  /admin/reports:
    get:
      tags: [Reports]
      summary: Get system-wide administrator reports for an optional date range
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: start_date
          schema: { type: string, format: date }
        - in: query
          name: end_date
          schema: { type: string, format: date }
      responses:
        "200": { description: Global report aggregates filtered by prediction time and weather record date; account totals remain all-time }
        "400": { description: Invalid date range }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/dashboard:
    get:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: System-wide administrator dashboard summary }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/analytics:
