<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
  <body style="margin:0;background:#f3f7f7;color:#233b43;font-family:Arial,sans-serif;padding:28px 12px">
    <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;margin:auto;background:#fff;border:1px solid #e1e9e9;border-radius:14px">
      <tr><td style="background:#0d4544;padding:20px 28px;color:#fff;font-size:19px;font-weight:bold">🦟 Dengue<span style="color:#9fe3c7">Watch</span></td></tr>
      <tr><td style="padding:28px">
        <h1 style="font-size:20px">Your daily dengue prediction summary</h1>
        <p style="font-size:14px;line-height:1.7">Hello {{ user_name }},</p>
        <p style="font-size:14px;line-height:1.7;white-space:pre-line">{{ message }}</p>
        <p style="font-size:12px;line-height:1.6;color:#71848a">This summary is informational and is not a medical diagnosis. Contact a healthcare professional if you have symptoms.</p>
      </td></tr>
      <tr><td style="background:#f8faf9;padding:16px 28px;font-size:11px;color:#829296">DengueWatch · Stay informed. Take preventive action.</td></tr>
    </table>
  </body>
</html>
